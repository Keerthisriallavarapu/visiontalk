[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "visiontalk"
version = "0.1.0"
description = "Vision-language assistant with LoRA fine-tuning and grounded VQA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
  "torch>=2.5.0",
  "transformers>=4.46.0",
  "accelerate>=1.0.0",
  "peft>=0.13.0",
  "Pillow>=10.4.0",
  "datasets>=3.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.12",
  "sse-starlette>=2.1.0",
  "pydantic>=2.9.0",
  "typer>=0.12.0",
  "rich>=13.8.0",
  "tqdm>=4.66.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
quantize = ["bitsandbytes>=0.44.0", "optimum>=1.23.0", "onnx>=1.17.0", "onnxruntime>=1.19.0"]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[project.scripts]
visiontalk = "visiontalk.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["visiontalk"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
